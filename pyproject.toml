[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "farelab"
version = "0.1.0"
description = "U.S. airline route pricing and revenue analytics pipeline"
readme = "README.md"
authors = [{ name = "Giridhar Achuthananda" }]
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "linearmodels>=7,<8",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<22",
  "scikit-learn>=1.6,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
api = [
  "anthropic>=0.97,<1",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline/farelab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
